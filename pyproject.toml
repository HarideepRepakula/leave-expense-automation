[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leave-expense-automation"
version = "0.7.0"
description = "Enterprise Leave and Expense Approval Automation System (synthetic data, deterministic rules)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # Phase 2: database layer
    "SQLAlchemy>=2.0.30,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.1.18,<4",
    "python-dotenv>=1.0,<2",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    # Phase 3: generator (pinned exactly for reproducible checksums, DEC-40)
    "numpy==2.2.6",
    "Faker==37.4.0",
    "PyYAML==6.0.2",
    "bcrypt==4.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-cov>=5,<6",
    "ruff>=0.5,<1",
]
# Added in later phases (kept here so the full stack is visible):
# phase9 = ["fastapi>=0.111", "uvicorn[standard]>=0.30", "python-jose[cryptography]>=3.3", "passlib[bcrypt]>=1.7", "httpx>=0.27"]
# phase10 = ["streamlit>=1.35", "plotly>=5.22"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: tests that need the lea_test PostgreSQL database",
]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"
