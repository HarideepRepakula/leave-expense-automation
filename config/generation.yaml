# Generation parameters (docs/07). Every value is an ASSUMPTION (illustrative synthetic), see docs/09.
illustrative_synthetic: true

master_seed: 20261022                 # ASM-023
as_of_date: 2026-10-22                # AM-A7
window_start: 2025-01-01              # AM-A6
master_load_timestamp: "2024-12-31T00:00:00Z"   # created_at of master rows (docs/07 section 6)

# RNG streams, in spawn order. Append new names at the END only: SeedSequence.spawn assigns children by
# position, so inserting a name would change every later stream (docs/07 section 4).
# Phase 4: `anomalies` / `boundaries` drive LEAVE edits; `anomalies_expense` / `boundaries_expense` drive EXPENSE
# edits, so changing one request volume never reshuffles the other's planted records (AM-A8, CF-10).
streams: [employees, cost_centers, balances, leave, expenses, anomalies, boundaries, delays, payments,
          delegations, users, anomalies_expense, boundaries_expense, expense_quantities]

volumes:                              # CLI flags override employees / leave_requests / expense_claims
  employees: 400
  leave_requests: 800
  expense_claims: 1000
  reference_employees: 400            # scale base for delegation and OPS_ANALYST counts

employees:
  country_shares: {IN: 0.50, US: 0.30, GB: 0.20}                        # ASM-001
  grade_shares: {G1: 0.30, G2: 0.25, G3: 0.18, G4: 0.12, G5: 0.08, G6: 0.06, G7: 0.01}  # ASM-014
  department_shares:                                                     # ASM-P3-01
    DEPT-01: 0.25   # Engineering
    DEPT-02: 0.18   # Sales
    DEPT-03: 0.10   # Finance
    DEPT-04: 0.07   # HR
    DEPT-05: 0.15   # Operations
    DEPT-06: 0.08   # Marketing
    DEPT-07: 0.10   # IT
    DEPT-08: 0.07   # Legal
  finance_department: DEPT-03
  operations_department: DEPT-05
  employment_start_min: 2015-01-01                                       # ASM-026
  employment_start_max: 2026-09-30
  structural_start_max: 2024-12-31                                       # ASM-P3-03
  terminated_share: 0.05                                                 # ASM-026
  termination_end_min: 2025-01-01
  termination_end_max: 2026-09-30
  leave_of_absence_share: 0.02
  email_domain: example.test
  grade_titles:                                                          # ASM-P3-04
    G1: Associate
    G2: Specialist
    G3: Senior Specialist
    G4: Lead
    G5: Manager
    G6: Senior Manager
    G7: Chief Financial Officer

delegations:                                                             # ASM-049
  count_at_reference: 10
  min_days: 5
  max_days: 20

users:                                                                   # ASM-036
  password_length: 12
  bcrypt_rounds: 4                     # ASM-P3-10: lowest cost; synthetic dev credentials only
  ops_analysts_at_reference: 5
  process_owner_departments: [DEPT-03, DEPT-04]   # Finance and HR heads
  admin_username: admin@example.test

timeline:
  weekend_submission_weight: 0.4      # ASM-P3-05 weekday weight is 1.0 (ASM-022 "mild weekday bias")
  submission_hour_min: 8              # ASM-P3-05 UTC hour range of submission timestamps
  submission_hour_max: 18
  draft_share: 0.01                   # ASM-022

leave:
  type_weights:                       # ASM-P3-06
    IN: {ANNUAL: 0.50, SICK: 0.25, CASUAL: 0.15, UNPAID: 0.10}
    US: {ANNUAL: 0.60, SICK: 0.30, UNPAID: 0.10}
    GB: {ANNUAL: 0.60, SICK: 0.30, UNPAID: 0.10}
  # Business-day count N drawn with weight decay**(N - min_bd) ("skewed short"); quantity = N - 0.5 per flag.
  durations:                          # ASM-042
    ANNUAL: {min_bd: 1, max_bd: 15, decay: 0.82, min_quantity: "1.0", half_day_prob: 0.10}
    CASUAL: {min_bd: 1, max_bd: 3,  decay: 0.60, min_quantity: "0.5", half_day_prob: 0.25}
    SICK:   {min_bd: 1, max_bd: 7,  decay: 0.65, min_quantity: "0.5", half_day_prob: 0.15}
    UNPAID: {min_bd: 1, max_bd: 20, decay: 0.88, min_quantity: "1.0", half_day_prob: 0.0}
  start_offset_days:                  # days from submission date to start date, before moving to a business day
    default: {min: 1, max: 60}
    SICK: {min: -3, max: 60}
  last_leave_date: 2026-12-31         # ASM-P3-13 no 2027 balances exist, so leave ends by this date
  max_attempts_per_request: 500
  # ASM-P5-07 (AMB-P5-01): designated year-end requests that span Dec 31 -> Jan 1, so that about 3 percent of all
  # requests cross a leave-year boundary (ASM-042). Natural spans alone gave 5 of 800 (0.62 percent) in Phase 5.
  year_end:
    share: 0.03                       # probability per request, drawn once per request from the leave stream
    new_year_business_days: 1         # business days after Jan 1; the rest fall in the last December days

expenses:
  line_count_weights: [0.25, 0.22, 0.18, 0.12, 0.07, 0.05, 0.04, 0.03, 0.02, 0.02]   # 1..10 lines, ASM-041
  primary_category_weights:           # ASM-P3-07
    TRAVEL: 0.20
    MEALS: 0.30
    ACCOMMODATION: 0.15
    OFFICE_SUPPLIES: 0.15
    TRAINING: 0.08
    CLIENT_ENTERTAINMENT: 0.12
  same_category_share: 0.70           # ASM-P3-07 share of lines in the claim's drawn category
  amount_range_usd:                   # ASM-041, drawn log-uniform, converted at the submission-date rate
    TRAVEL: [50, 1400]
    MEALS: [8, 70]
    ACCOMMODATION: [80, 290]
    OFFICE_SUPPLIES: [5, 240]
    TRAINING: [100, 1900]
    CLIENT_ENTERTAINMENT: [20, 190]
  submission_after_latest_line_days: [1, 30]   # ASM-041 / docs/07 section 6
  max_line_age_days: 90
  receipt_below_threshold_share: 0.60  # ASM-P3-08 lines >= threshold always carry a receipt
  merchant_labels:                     # ASM-P3-09
    TRAVEL: [Taxi fare, Train fare, Flight, Car hire, Fuel]
    MEALS: [Breakfast, Lunch, Dinner, Team meal]
    ACCOMMODATION: [Hotel stay, Serviced apartment]
    OFFICE_SUPPLIES: [Stationery, Printer supplies, Computer accessories]
    TRAINING: [Course fee, Conference registration, Certification exam]
    CLIENT_ENTERTAINMENT: [Client dinner, Client lunch, Event tickets]
  max_attempts_per_claim: 500
  # ASM-P6-02: quantity x unit amount on every line (V-ARITH-03). Quantity is drawn from the
  # expense_quantities stream among 1..max that divide the line amount in cents exactly, so the line
  # amount itself (drawn in Phase 3) never changes.
  quantity_max: {TRAVEL: 3, MEALS: 4, ACCOMMODATION: 5, OFFICE_SUPPLIES: 10, TRAINING: 1, CLIENT_ENTERTAINMENT: 4}

# Stage S5 (Phase 4): planted scenarios, controls and boundaries (docs/07 sections 7-8, ASM-027).
# Counts are at the full reference volumes; other volumes scale them, minimum 1 (ASM-028).
# Units: records, except S02/S06a/S06b (pairs) and S09 (pairs and triples).
anomalies:
  reference_volumes: {leave: 800, expense: 1000}
  leave: {S01: 8, S02: 8, S03: 12, S19-L: 4, S22: 8, S23: 8}
  expense: {S05: 10, S06a: 8, S06b: 8, S07a: 8, S07b: 8, S08: 8, S10: 8, S15: 8, S19-E: 4, S21: 8, S26: 8}
  split_groups: {pairs: 6, triples: 2}          # S09
  controls:
    S01b: 8                                     # permitted negative balance, LPOL-ANNUAL-US
    S04_min_total: 40                           # leave requests spanning a holiday, natural + planted
    S24: {leave: 4, expense: 4}                 # delegated L1
    S14-L5: 8                                   # ASM-P4-01: claims above 5,000 USD (L5 route)
  attempts: {S11: 8, S12: 8, S13: 8, S18: 8}    # rows only exist once Phases 7-8 build them
  fixtures: {S16: 8, S17: 8, S20: 2}            # tests/fixtures/negative
  parameters:
    s07a_line_factor: ["1.20", "2.00"]          # line amount = per-line limit x factor
    s07b_claim_factor: ["1.05", "1.30"]         # claim total = per-claim limit x factor
    s01_excess_days: [1, 3]                     # quantity above the available balance (whole days)
    s01b_negative_days: [1, 3]                  # LPOL-ANNUAL-US balance after approval: -1..-3 (limit 3)
    s03_excess_days: [1, 4]
    s14l5_usd: ["5100.00", "5800.00"]           # within the 6,000 USD per-claim limit
    s22_max_gap_hours: 24                       # partner request submitted at most this long before
boundaries:
  per_case: 3                                   # BC-01..BC-09 each sub-case (docs/02 section 6)
  bc10_groups: 2
